<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="1000" viewBox="0 0 1000 1000">
  <!-- Фон и граница карты. -->
  <rect width="1000" height="1000" fill="#18212b" />
  <rect x="20" y="20" width="960" height="960"
        fill="none" stroke="#8193a6" stroke-width="2" />

  <!-- Сетка с шагом 200 единиц SVG. -->
  <path d="M200 20V980 M400 20V980 M600 20V980 M800 20V980
           M20 200H980 M20 400H980 M20 600H980 M20 800H980"
        fill="none" stroke="#2e3d4c" stroke-width="1" />

  <!-- Условные здания учебной карты. -->
  <g fill="#35495a" stroke="#91a6b8" stroke-width="2">
    <rect x="140" y="160" width="180" height="140" />
    <rect x="700" y="180" width="160" height="220" />
    <rect x="200" y="660" width="240" height="160" />
  </g>

  <!-- Мировой точке X=0, Z=0 соответствует SVG (500, 500). -->
  <path d="M460 500H540 M500 460V540"
        fill="none" stroke="#6bd3df" stroke-width="2" />
  <circle cx="500" cy="500" r="5" fill="#6bd3df" />

  <g fill="#dbe6ef" font-family="sans-serif" font-size="20">
    <text x="40" y="60">NADIR - TEST MAP</text>
    <text x="515" y="485">WORLD ORIGIN</text>
  </g>
</svg>